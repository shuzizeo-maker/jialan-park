<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081124">
  <title>嘉蘭遊樂場｜快樂學習闖關樂園</title>
  <meta name="description" content="嘉蘭遊樂場：結合國語、數學、英語、自然、社會的 3D 闖關遊樂園，適合國小三到六年級。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
  <style>
    /* —— 原本園區的控制列樣式（只套用在 .park-controls 裡，避免影響闖關介面）—— */
    * { box-sizing: border-box }
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; display: block }
    body { background: #081124 }
    canvas { cursor: grab; touch-action: none }
    .park-controls {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 6px 7px 6px 14px;
      border: 1px solid #fff2cd33; border-radius: 13px; background: #13202cce;
      box-shadow: 0 3px 14px #06112135; color: #fff3dd;
      font-family: system-ui, sans-serif; backdrop-filter: blur(8px); pointer-events: auto;
    }
    .clock { display: grid; gap: 1px }
    .clock-label { color: #d3c7b4; font-size: 10px; letter-spacing: .09em }
    time { font-size: 16px; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: .035em }
    .park-controls button {
      display: flex; align-items: center; gap: 6px; min-height: 40px; cursor: pointer;
      padding: 0 9px; border: 1px solid #f3d29142; border-radius: 8px;
      background: #f9d18f14; color: #ffdfa3; font: 500 12px system-ui, sans-serif;
    }
    .park-controls button:hover { background: #f9d18f2b }
    [data-light-mode][aria-pressed="true"],#burst-sound[aria-pressed="true"] { color: #20303b !important; background: #f4d99f !important }
    #burst-sound[aria-pressed="true"] .muted,#burst-sound[aria-pressed="false"] .audible { display:none }
    .park-controls button:focus-visible { outline: 2px solid #ffdfa3; outline-offset: 3px }
    .park-controls button svg { height: 16px; width: 16px; fill: currentColor }
    .park-controls button .on,.park-controls button[data-playing="true"] .off { display: none }
    .park-controls button[data-playing="true"] .on { display: inline }
    @media (max-width: 760px) {
      .park-controls { gap: 5px; padding: 5px 6px 5px 9px }
      .park-controls button { padding: 0 8px }
      .park-controls button span { display: none }
    }
  </style>
  <link rel="stylesheet" href="./quest.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas aria-label="嘉蘭遊樂場：五大主題園區、城堡、摩天輪、雲霄飛車等遊樂設施。點一下設施即可闖關；拖曳旋轉視角，雙指或滾輪縮放。"></canvas>

  <!-- 載入畫面：第一幀畫好後由 park.js 隱藏 -->
  <div id="loading"><div><div class="spin">🎡</div><b>嘉蘭遊樂場</b><small>樂園準備中，請稍候…</small></div></div>

  <!-- 上方工具列：左邊是原本的時鐘/音樂/日夜/煙火音效，右邊是闖關進度 -->
  <div class="topbar">
    <div class="park-controls">
      <div class="clock"><span class="clock-label">臺灣時間</span><time id="park-clock"></time></div>
      <button id="music" type="button" data-playing="false" aria-pressed="false" aria-label="開啟音樂">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.6 21 2v13.5c0 2.050-2.06 3.7-4.58 3.7-2.02 0-3.42-1.09-3.42-2.65 0-2.04 2.04-3.75 4.48-3.75.5 0 1.01.07 1.44.19V6.35L11 8.050v9.7c0 2.050-2.06 3.7-4.58 3.7C4.4 21.45 3 20.36 3 18.8c0-2.04 2.04-3.75 4.48-3.75.52 0 1.04.08 1.52.2V4.6Z"/></svg>
        <span class="off">開啟音樂</span><span class="on">暫停音樂</span>
      </button>
      <button id="day-mode" data-light-mode="day" type="button" aria-pressed="false" title="用白天的光線欣賞園區">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g></svg>
        <span>切換白天</span>
      </button>
      <button id="night-mode" data-light-mode="night" type="button" aria-pressed="false" title="欣賞夜晚的遊樂園燈光">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M20.7 14.3A8.9 8.9 0 0 1 9.7 3.3a9 9 0 1 0 11 11Z"/></svg>
        <span>切換晚上</span>
      </button>
      <button id="burst-sound" type="button" aria-pressed="false" aria-label="開啟煙火爆炸音效" title="開啟煙火爆炸音效">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z"/><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path class="audible" d="M15 8q4 4 0 8m3-11q7 7 0 14"/><path class="muted" d="m16 9 5 6m0-6-5 6"/></g></svg>
        <span>煙火音效</span>
      </button>
    </div>

    <aside class="hud" aria-label="闖關進度">
      <div class="hud-row">
        <b class="hud-title">🎡 嘉蘭遊樂場</b>
        <select id="grade-select" aria-label="選擇年級">
          <option value="3">三年級</option><option value="4">四年級</option>
          <option value="5">五年級</option><option value="6">六年級</option>
        </select>
      </div>
      <div class="hud-row">
        <div id="badges" class="badges"></div>
        <div class="progress" title="已過關的設施"><div class="bar"><i id="progress-bar"></i></div><span>⭐ <b id="progress-text">0 / 11</b></span></div>
      </div>
      <div class="hud-row small">
        <button type="button" id="sfx-toggle" class="mini" aria-pressed="true">🔔 音效開</button>
        <button type="button" id="show-btn" class="mini gold" style="display:none">🎆 煙火秀</button>
        <button type="button" id="reset-btn" class="mini">↺ 重設</button>
      </div>
    </aside>
  </div>

  <!-- 設施名牌（由 quest.js 產生並跟著 3D 位置移動） -->
  <div id="ride-tags"></div>

  <!-- 園區介紹面板 -->
  <section id="land-sheet" class="sheet" style="display:none" aria-live="polite"></section>

  <!-- 下方：園區快速導覽 -->
  <nav id="land-nav" class="land-nav" aria-label="園區快速導覽"></nav>

  <!-- 闖關視窗（燈箱） -->
  <div id="quest-modal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="quest-head">
    <div class="modal-card">
      <header><div id="quest-head" class="quest-head"></div><button type="button" id="quest-close" class="x" aria-label="關閉">✕</button></header>
      <div id="quest-body" class="quest-body"></div>
    </div>
  </div>

  <!-- 全部過關慶祝畫面 -->
  <div id="celebrate" class="modal party" style="display:none" role="dialog" aria-modal="true">
    <div class="modal-card party-card">
      <div class="big">🎆</div>
      <h2>恭喜！五大園區全部闖關成功！</h2>
      <div class="party-badges"></div>
      <p>嘉蘭遊樂場為你施放煙火！記得打開「煙火音效」🔊</p>
      <div class="actions">
        <button type="button" class="btn primary" id="party-night">🌙 到夜空中看煙火</button>
        <button type="button" class="btn" id="party-close">繼續逛樂園</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none" role="status"></div>
  <script type="module" src="./park.js"></script>
</body>
</html>
